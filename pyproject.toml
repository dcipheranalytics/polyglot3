[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot3"
dynamic = ["version"]
description = "Multilingual NLP pipeline (tokenization, language detection, NER, POS, sentiment, embeddings) for Python 3, without ICU."
readme = "README.rst"
requires-python = ">=3.9"
license = "GPL-3.0-or-later AND Unicode-3.0"
license-files = ["LICENSE", "polyglot/tokenize/data/LICENSE-ICU"]
authors = [
  { name = "Rami Al-Rfou", email = "rmyeid@gmail.com" },
  { name = "Dcipher Analytics dev team" },
]
keywords = ["nlp", "multilingual", "tokenization", "named-entity-recognition",
            "part-of-speech", "language-detection", "word-embeddings"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "numpy>=1.21",
  "fasttext-langdetect>=1.1.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/dcipheranalytics/polyglot3"
Source = "https://github.com/dcipheranalytics/polyglot3"
"Original project" = "https://github.com/aboSamoor/polyglot"

[project.scripts]
polyglot = "polyglot.__main__:main"
polyglot3 = "polyglot.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "polyglot.__version__" }

[tool.setuptools.packages.find]
include = ["polyglot*"]

[tool.setuptools.package-data]
"polyglot.tokenize" = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "polyglot"]

[tool.ruff]
target-version = "py39"
extend-exclude = ["docs"]

[tool.ruff.lint]
# Errors only (syntax, undefined names, unused imports/variables); no style rules.
select = ["E9", "F"]
